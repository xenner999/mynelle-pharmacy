<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Mynelle's Pharmacy</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#0d0d0d;
       background-color:#f2f4f9;background-image:radial-gradient(900px 520px at 100% 0%,rgba(5,175,242,.18),transparent 60%),radial-gradient(820px 520px at 0% 100%,rgba(4,66,191,.12),transparent 60%),radial-gradient(520px 320px at 100% 100%,rgba(217,4,22,.07),transparent 65%);background-attachment:fixed;background-repeat:no-repeat;}
  .wrap{width:min(92vw,560px);text-align:center}
  img{height:96px;width:auto;margin-bottom:8px}
  h1{font-size:22px;margin:0 0 6px}p{margin:0 0 26px;color:#6b7280;font-size:14px}
  .grid{display:grid;gap:14px}
  a.card{display:block;background:#fff;border:1px solid #e1e6f0;border-radius:16px;padding:22px;text-decoration:none;color:inherit;text-align:left;
         box-shadow:0 10px 30px rgba(24, 24, 24,.07);transition:transform .15s,box-shadow .15s}
  a.card:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(24, 24, 24,.12)}
  a.card b{display:block;font-size:16px;margin-bottom:4px}a.card span{font-size:13.5px;color:#6b7280}
  .pos b{color:#0442bf}.admin b{color:#0d0d0d}
</style>
</head>
<body>
  <div class="wrap">
    <img src="assets/logooo.png" alt="Mynelle's Pharmacy" />
    <h1>Welcome</h1>
    <p>Choose where you're going.</p>
    <div class="grid">
      <a class="card pos" href="pos/html/timetracker.html"><b>Cashier terminal</b><span>Sign in with your Employee ID and PIN, check in, then open the POS.</span></a>
      <a class="card admin" href="main/html/Login.html"><b>Admin &amp; pharmacist</b><span>Dashboard, inventory, sales, reports, analytics and accounts.</span></a>
    </div>
  </div>
<script src="main/js/ui-assist.js"></script>
</body>
</html>
