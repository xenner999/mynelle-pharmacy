<!doctype html>
<html lang="en">
  <head>
    <meta name="robots" content="noindex, nofollow" />
    <meta charset="UTF-8" />
    <script src="../js/supabase-sync.js"></script>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("mynelle_settings");
          var g = (raw && JSON.parse(raw).general) || {};
          document.documentElement.setAttribute("data-theme", g.theme || "light");
          document.documentElement.setAttribute("data-density", g.density || "comfortable");
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mynelle's Pharmacy — Low Stock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/inventory.css" />
    <link rel="stylesheet" href="../css/status-detail.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
      <link rel="stylesheet" href="../../assets/uicons/uicons-regular-rounded.css" />
      <link rel="stylesheet" href="../css/stock-status.css" />

  <body>
    <div class="app">
      <!-- Sidebar -->
      <aside class="sidebar">
        <a class="brand" href="dashboard.html" aria-label="Go to dashboard">
          <div class="brand-logo">
            <img src="../../assets/logooo.png" alt="Mynelle's Pharmacy logo" />
          </div>
        </a>

        <nav class="side-nav" id="sideNav">
          <a class="nav-item" href="dashboard.html" data-key="dashboard">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

            Dashboard
          </a>
          <a class="nav-item" href="inventory.html" data-key="inventory">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="8" y="2" width="8" height="4" rx="1" />

          <a class="nav-item" href="sales.html" data-key="sales">

              <polyline points="3 17 9 11 13 15 21 6" />
              <polyline points="14 6 21 6 21 13" />
            </svg>
            Sales
          </a>
          <a class="nav-item" href="reports.html" data-key="reports">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
              <polyline points="14 2 14 8 20 8" />
              <path d="M9 13h6M9 17h6" />
            </svg>
            Reports
          </a>
          <a class="nav-item" href="analytics.html" data-key="analytics">
            <svg
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 3v18h18" />
              <path d="M7 15v3M12 10v8M17 6v12" />
            </svg>
            Analytics
          </a>
          <a class="nav-item" href="orders.html" data-key="orders">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
              <line x1="3" y1="6" x2="21" y2="6" />
              <path d="M16 10a4 4 0 0 1-8 0" />
            </svg>
            Orders
          </a>
          <a class="nav-item active" href="alerts.html" data-key="alerts">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

              <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
            </svg>
            Alerts
          </a>
        </nav>

      </aside>

      <!-- Main -->
      <main>
        <header class="topbar">
          <div class="search-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="text" placeholder="Search products, sales, records..." />
          </div>
          <div class="topbar-actions">
            <a class="icon-btn" aria-label="Settings" href="settings.html">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3" />
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
              </svg>
            </a>
            <button class="icon-btn" aria-label="Notifications">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
                <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
              </svg>
            </button>
            <button class="icon-btn" aria-label="Profile">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </button>
          </div>
        </header>

        <div class="content">
          <div class="detail-page-head">
            <div>
              <a class="detail-back" href="alerts.html">
                <i class="fi fi-rr-arrow-small-left"></i>
                Alerts
              </a>
              <h1>Low stock products</h1>
            </div>
          </div>

          <div class="detail-summary" id="detailSummary"></div>

          <div class="panel">
            <div class="detail-toolbar">
              <p class="detail-count" id="detailCount"></p>
              <div class="detail-search">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="searchInput" placeholder="Search products..." />
              </div>
            </div>

            <div class="detail-table-head" id="detailTableHead"></div>
            <div id="detailTableWrap"></div>

            <div class="detail-empty" id="detailEmpty" hidden>
              <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>
              <p class="title" id="detailEmptyTitle">Nothing here</p>
              <p class="sub" id="detailEmptySub">You're all caught up.</p>
            </div>
          </div>

        </div>
      </main>
    </div>

    <script src="../js/auth-store.js"></script>
    <script>
      (function () {
        var session = MynelleAuth.getSession();
        if (!session) {
          window.location.href = "Login.html";
        } else if (session.account && session.account.role === "cashier") {
          window.location.href = "../../pos/html/timetracker.html";
        }
      })();
    </script>
    <script src="../js/settings-store.js"></script>
    <script src="../js/orders-store.js"></script>

  <script src="../js/stock-badges.js"></script>
<script src="../js/ui-confirm.js"></script>
<script src="../js/confirm-hooks.js"></script>
<script src="../js/print-records.js"></script>
<script src="../js/ui-assist.js"></script>
<script src="../js/chatbot.js"></script>
</body>
</html>
