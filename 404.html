<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" /><title>Page not found</title>
<style>body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background-color:#f2f4f9;background-image:radial-gradient(900px 520px at 100% 0%,rgba(5,175,242,.18),transparent 60%),radial-gradient(820px 520px at 0% 100%,rgba(4,66,191,.12),transparent 60%),radial-gradient(520px 320px at 100% 100%,rgba(217,4,22,.07),transparent 65%);background-attachment:fixed;background-repeat:no-repeat;color:#0d0d0d;text-align:center}a{color:#0442bf;font-weight:600}</style></head>
<body><div><h1>Page not found</h1><p>That page doesn't exist.</p><p><a id="home" href="/">Go to the start page</a></p></div>
<script>
  // On GitHub project sites the app lives at /<repo>/, so "/" would leave it.
  (function () {
    var onPages = /\.github\.io$/i.test(location.hostname);
    var seg = location.pathname.split("/")[1];
    if (onPages && seg) document.getElementById("home").href = "/" + seg + "/";
  })();
</script>
</body></html>
